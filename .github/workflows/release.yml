# Builds, attests and attaches the plugin's files to a release when it is
# published, as `gh release create 1.1.0 --generate-notes` publishes one.
# Obsidian downloads from the release whose tag is exactly the manifest
# version, and installs the files attached to it, so a release is installable
# once this has run.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The release event checks out the release's tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # A bare X.Y.Z, matching the manifest: a `v` tag or a mismatched version
      # is a release Obsidian would never find.
      - name: Tag is the manifest version
        run: |
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag $TAG is not a bare X.Y.Z"; exit 1; }
          test "$(node -p "require('./manifest.json').version")" = "$TAG"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Attach the files to the release
        run: gh release upload "$TAG" main.js manifest.json styles.css --clobber
